# Gateway local que imita as regras do Ingress (k8s/ingress.yaml) no Docker Compose.
# O nome do serviço no proxy_pass é resolvido pelo DNS do Docker, como o Service Discovery do Kubernetes.
# Se o ms-catalogo for escalado (--scale), o DNS devolve vários IPs e o nginx balanceia em round-robin.
server {
    listen 80;

    location /produtos {
        proxy_pass http://ms-catalogo:3000;
    }

    location /pedidos {
        proxy_pass http://ms-pedidos:8000;
    }

    location /notificacoes {
        proxy_pass http://ms-notificacoes:8080;
    }

    location = / {
        default_type text/plain;
        return 200 "Loja Cloud Native - rotas: /produtos /pedidos /notificacoes\n";
    }
}
