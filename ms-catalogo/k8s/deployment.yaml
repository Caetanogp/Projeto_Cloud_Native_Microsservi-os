apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-catalogo
  namespace: loja
  labels:
    app: ms-catalogo
spec:
  replicas: 3 # escalabilidade horizontal: o Service balanceia as requisições entre os 3 Pods
  selector:
    matchLabels:
      app: ms-catalogo
  template:
    metadata:
      labels:
        app: ms-catalogo
    spec:
      containers:
        - name: ms-catalogo
          image: ms-catalogo:latest # substituído por <registry>/ms-catalogo:<tag> em scripts/deploy
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: POD_NAME # Downward API: o nome do Pod aparece nas respostas
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_HOST # Service Discovery: nome do Service, nunca IP
              value: mysql-catalogo
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-catalogo-credentials
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-catalogo-credentials
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-catalogo-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
